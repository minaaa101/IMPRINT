<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMPRINT — Image Style Analysis</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">IMPRINT</a>
      <nav>
        <a class="active" href="/">Home</a>
        <a href="/analysis.html">Analysis</a>
        <a href="/about.html">About</a>
      </nav>
    </header>

    <main class="home">
      <section class="hero">
        <div class="hero-copy">
          <span class="eyebrow">Find your visual signature</span>
          <h1>IMAGE STYLE<br />ANALYSIS</h1>
          <p>AI 생성 이미지의 화풍 유사도를<br />정량적으로 분석합니다.</p>
        </div>
        <div class="image-stack" aria-hidden="true">
          <div class="crop crop-ghibli stack-a"><img
  src="{{ url_for('static', filename='assets/reference.png') }}"
  alt=""
/></div>
          <div class="crop crop-disney stack-b"><img
  src="{{ url_for('static', filename='assets/reference.png') }}"
  alt=""
/></div>
          <div class="crop crop-simpsons stack-c"><img
  src="{{ url_for('static', filename='assets/reference.png') }}"
  alt=""
/></div>
        </div>
      </section>

      <form
    class="upload-card"
    id="upload-form"
    action="/analyze"
    method="POST"
    enctype="multipart/form-data"
    >
        <label class="dropzone" id="dropzone">
          <span class="upload-icon">↑</span>
          <img class="selected-preview" id="selected-preview" alt="선택한 이미지 미리보기" />
          <strong id="upload-title">이미지를 업로드하세요</strong>
          <span id="upload-description">또는 여기에 드래그 앤 드롭</span>
          <small>JPG, PNG / 최대 10MB</small>
          <b id="upload-button-label">이미지 선택하기</b>
          <input
        id="image-input"
        type="file"
        name="image"
        accept="image/png,image/jpeg"
        required
    />        
    </label>
        <button class="primary" id="start-button" type="submit" disabled>분석 시작하기</button>
      </form>

      <section class="criteria">
        <h2>분석 기준</h2>
        <div class="method-grid">
          <article class="method"><i class="coral">C</i><div><strong>Color Histogram</strong><small>색상 분포 유사도 분석</small></div></article>
          <article class="method"><i class="blue">E</i><div><strong>CLIP Embedding</strong><small>이미지 의미 유사도 분석</small></div></article>
          <article class="method"><i class="green">S</i><div><strong>SSIM</strong><small>구조적 유사도 분석</small></div></article>
        </div>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script
    src="{{ url_for('static', filename='js/app.js') }}"
    defer
></script>
  </body>
</html>
