name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ] # GitHub 기본 브랜치가 master라면 master로 변경하세요.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote rm hf 2>/dev/null || true
          
          # 1. 인증 정보가 포함된 안전한 URL 포맷으로 원격 저장소 등록
          git remote add hf https://minaaa101:$HF_TOKEN@huggingface.co/spaces/minaaa101/INPRINT
          
          # 2. 주소창 대신 등록된 원격 저장소 이름(hf)을 이용해 안전하게 푸시
          git push --force hf main
